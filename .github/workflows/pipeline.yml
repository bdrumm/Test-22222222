name: pipeline
# Collects MTA realtime arrivals for the configured targets, pulls Open Data context,
# runs the station analyses and publishes the review site to GitHub Pages.
on:
  schedule:
    - cron: "7 * * * *"          # hourly; each run collects for ~50 minutes
  workflow_dispatch:
    inputs:
      collect_minutes:
        description: "Minutes to poll the realtime feeds (0 to skip collection)"
        default: "50"
      refresh_context:
        description: "Pull Open Data / weather context"
        type: boolean
        default: true
  push:
    branches: [claude/train-delay-analysis-framework-auxzv1, main]
    paths: [site/**, pipeline/**, mta_delay_insights/**, .github/workflows/pipeline.yml]

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Check out data branch
        run: pipeline/data_branch.sh checkout
      - name: Check out published site (models for live snapshots)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth 1 && git worktree add gh-pages-branch origin/gh-pages && git -C gh-pages-branch checkout -B gh-pages
          else
            mkdir -p gh-pages-branch
          fi
      - name: Static GTFS
        run: |
          mkdir -p data
          curl -sSL --retry 3 -o data/gtfs_subway.zip https://rrgtfsfeeds.s3.amazonaws.com/gtfs_subway.zip
      - name: Collect realtime arrivals
        env:
          MINUTES: ${{ github.event_name == 'push' && '4' || github.event.inputs.collect_minutes || '50' }}
        run: |
          if [ "$MINUTES" != "0" ]; then python -m pipeline.collect --minutes "$MINUTES" --live-every 360 --live-publish pipeline/live_publish.sh; else echo "collection skipped"; fi
      - name: Pull Open Data and weather context
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.refresh_context == 'true' }}
        run: python -m pipeline.context
      - name: Commit data branch
        run: pipeline/data_branch.sh commit
      - name: Build site
        run: python -m pipeline.build_site --out _site
      # Publishing path 1: the gh-pages branch (works with Pages source "Deploy from a branch").
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: mta-insights-bot
          user_email: mta-insights-bot@users.noreply.github.com
      # Publishing path 2: Pages via Actions (works once the Pages source is "GitHub Actions").
      # The workflow token cannot enable Pages itself, so these steps are allowed to fail.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site
      - id: deploy
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Verify published site
        continue-on-error: true
        env:
          URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          has_pages=$(curl -sS "https://api.github.com/repos/${{ github.repository }}" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("has_pages"))')
          echo "has_pages=$has_pages"
          sleep 45
          code=$(curl -sS -o /dev/null -w "%{http_code}" "${URL}data/index.json" || echo "000")
          echo "published site ${URL} -> HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::warning::Site not served yet (HTTP ${code}). Enable Pages: Settings > Pages > Source 'Deploy from a branch' (gh-pages, /) or 'GitHub Actions'."
          fi

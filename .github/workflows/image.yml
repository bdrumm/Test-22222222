name: image
# Build the self-hosting image (and publish it to GHCR) whenever the package, site or deployment files change.
on:
  push:
    branches: ["claude/train-delay-analysis-framework-auxzv1", "main"]
    paths: ["Dockerfile", "deploy/**", "pyproject.toml", "mta_delay_insights/**", "pipeline/**", "site/**", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mta-delay-insights:latest
            ghcr.io/${{ github.repository_owner }}/mta-delay-insights:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/mta-delay-insights:latest mta-insights --help | head -5
          docker run --rm ghcr.io/${{ github.repository_owner }}/mta-delay-insights:latest python -c "import mta_delay_insights.models, mta_delay_insights.realtime.server; print('image ok')"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mta-delay-insights"
version = "0.1.0"
description = "Framework for analyzing causes, significance, and mitigation of train arrival delays at MTA stations using GTFS-Realtime, service alerts, NY Open Data, and weather feeds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "requests>=2.28",
    "protobuf>=4.21",
    "gtfs-realtime-bindings>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
mta-insights = "mta_delay_insights.cli:main"

[tool.setuptools.packages.find]
include = ["mta_delay_insights*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
